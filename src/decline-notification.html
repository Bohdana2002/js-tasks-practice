<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <section class="task reminder-task">
      <h2>Reminder</h2>
      <input
        class="reminder-input"
        type="text"
        placeholder="Текст нагадування"
      />
      <button class="start-reminder" type="button">Запустити</button>
      <button class="cancel-reminder" type="button">Скасувати</button>
      <p class="reminder-status">Нагадування не заплановане</p>
    </section>

    <script type="module" src="./decline-notification.js"></script>
  </body>
</html>
